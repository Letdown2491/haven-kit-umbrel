manifestVersion: 1
id: havenkit-haven
name: HAVEN Kit
tagline: High Availability Vault for Events on Nostr
icon: https://raw.githubusercontent.com/Letdown2491/haven-kit-umbrel/master/assets/haven-icon.svg
category: social
version: "1.5.0"
port: 8080
description: >-
  Haven is a sovereign personal relay for the Nostr protocol, designed for storing
  and backing up sensitive notes like eCash, private chats, and drafts.


  Haven operates as four specialized relays in one application:

  - Private Relay: Restricted to the owner for drafts and sensitive content

  - Chat Relay: For direct messages with web-of-trust filtering

  - Inbox Relay: Aggregates notes where the owner is mentioned

  - Outbox Relay: Publicly accessible storage for owner's posts

  - Blossom Media Server: Hosts images and videos for sharing


  Features include intelligent filtering through web-of-trust protection, automatic
  note aggregation from other relays, cloud backup capabilities, and broadcast
  distribution to multiple relays simultaneously.

developer: Letdown2491
website: https://github.com/Letdown2491/haven-kit-umbrel
submitter: Letdown2491
submission: https://github.com/getumbrel/umbrel-apps
repo: https://github.com/Letdown2491/haven-kit-umbrel
support: https://github.com/Letdown2491/haven-kit-umbrel/issues
gallery:
  - https://raw.githubusercontent.com/Letdown2491/haven-kit-umbrel/master/assets/haven-kit-info.jpg
  - https://raw.githubusercontent.com/Letdown2491/haven-kit-umbrel/master/assets/haven-kit-configuration.jpg
releaseNotes: >-
  This release hardens setup against mistyped keys and adds a timezone picker.


  - A mistyped npub is now caught the moment you enter it, with a clear error,
    instead of being saved and silently crash-looping the relay. The setup
    wizard, the save endpoint, and the relay startup check all verify the npub's
    bech32 checksum, not just its shape.

  - Added a timezone selector (IANA zones) in Relay Configuration for relay log
    timestamps; previously the timezone could only be set by hand-editing .env.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
