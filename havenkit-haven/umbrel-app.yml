  - https://raw.githubusercontent.com/Letdown2491/haven-kit-umbrel/master/assets/haven-kit-info.jpg
  - https://raw.githubusercontent.com/Letdown2491/haven-kit-umbrel/master/assets/haven-kit-configuration.jpg
releaseNotes: >-
  This release fixes Blossom media being lost on every relay restart.


  Uploaded images and videos now persist across restarts. The media storage
  path was missing a trailing slash, so uploads were written outside the mounted
  volume and disappeared when the relay restarted (clients saw them until then,
  then got 404s). Defaults are corrected, the config UI normalizes the path you
  enter, and the relay repairs a bad value on startup.


  Note: media uploaded before this update was never saved to disk and cannot be
  recovered; the fix only makes future uploads persist.
