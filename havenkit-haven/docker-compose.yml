services:

  # App Proxy for Umbrel integration (serves the config UI, behind Umbrel auth)
  app_proxy:
    environment:
      APP_HOST: $APP_HAVEN_CONFIG_UI_IP
      APP_PORT: 8080

  # Haven Nostr Relay
  haven_relay:
    image: letdown2491/haven-relay:v1.5.1
    container_name: haven_relay
    restart: unless-stopped
    ports:
      # Clearnet LAN access to the relay + Blossom media server
      - "3355:3355"
    volumes:
      - ${APP_DATA_DIR}/config:/haven-config
      - ${APP_DATA_DIR}/blossom:/haven/blossom
      - ${APP_DATA_DIR}/db:/haven/db
    env_file:
      - ${APP_DATA_DIR}/config/.env
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3355"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      default:
        ipv4_address: $APP_HAVEN_RELAY_IP

  # Configuration UI
  config_ui:
    image: letdown2491/haven-config-ui:v1.5.1
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/config:/haven-config
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only view of Tor data so the UI can display the relay's .onion
      # address (written by the tor sidecar below)
      - ${TOR_DATA_DIR}:/tor:ro
    working_dir: /
    env_file:
      - ${APP_DATA_DIR}/config/.env
    environment:
      - DOCKER_SOCK=/var/run/docker.sock
      - CONTAINER_RUNTIME=docker
      - APP_DATA_DIR=${APP_DATA_DIR}
      - APP_HIDDEN_SERVICE=${APP_HIDDEN_SERVICE}
      - RELAY_HIDDEN_SERVICE_FILE=/tor/app-havenkit-haven-relay/hostname
      - RELAY_CONTAINER_NAME=haven_relay
      - RELAY_IMAGE_NAME=letdown2491/haven-relay:v1.5.1
      - TZ=UTC
    depends_on:
      - haven_relay
    networks:
      default:
        ipv4_address: $APP_HAVEN_CONFIG_UI_IP

  # Dedicated Tor hidden service exposing the relay (NOT the config UI, which
  # stays behind Umbrel's auth via app_proxy). Umbrel renders torrc.template
  # into ${APP_DATA_DIR}/torrc and provides TOR_DATA_DIR.
  tor:
    image: getumbrel/tor:0.4.7.8@sha256:2ace83f22501f58857fa9b403009f595137fa2e7986c4fda79d82a8119072b6a
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/torrc:/etc/tor/torrc:ro
      - ${TOR_DATA_DIR}:/data
    environment:
      HOME: "/tmp"
    depends_on:
      - haven_relay
