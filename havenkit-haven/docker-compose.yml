services:

  # Haven Nostr Relay
  haven_relay:
    image: letdown2491/haven-relay:v1.3.3
    container_name: haven_relay
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/config:/haven-config
      - ${APP_DATA_DIR}/blossom:/haven/blossom
      - ${APP_DATA_DIR}/db:/haven/db
    env_file:
      - ${APP_DATA_DIR}/config/.env
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3355"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Configuration UI
  config_ui:
    image: letdown2491/haven-config-ui:v1.3.3
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/config:/haven-config
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /
    env_file:
      - ${APP_DATA_DIR}/config/.env
    environment:
      - DOCKER_SOCK=/var/run/docker.sock
      - CONTAINER_RUNTIME=docker
      - APP_DATA_DIR=${APP_DATA_DIR}
      - RELAY_CONTAINER_NAME=haven_relay
      - RELAY_IMAGE_NAME=letdown2491/haven-relay:v1.3.3
      - TZ=UTC
    depends_on:
      - haven_relay

  # Reverse proxy to split Tor vs clearnet routing
  reverse_proxy:
    image: nginx:1.25-alpine
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/reverse-proxy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/conf.d
      - APP_HIDDEN_SERVICE=${APP_HIDDEN_SERVICE}
      - DEVICE_HOSTNAME=${DEVICE_HOSTNAME}
      - DEVICE_DOMAIN_NAME=${DEVICE_DOMAIN_NAME}
    depends_on:
      - config_ui
      - haven_relay

  # App Proxy for Umbrel integration
  app_proxy:
    environment:
      APP_HOST: reverse_proxy
      APP_PORT: 8080
